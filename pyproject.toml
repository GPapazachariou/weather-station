[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-station"
version = "1.0.0"
description = "Scalable async weather station simulator and real-time dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.19.0",
    "Flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["consumer_client", "scripts", ".venv", "docs"]
pythonpath = ["server", "web", "station_client"]
asyncio_mode = "auto"
addopts = "--cov=protocol --cov=web --cov=app --cov=client --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["server", "web", "station_client"]
omit = [
    "*/tests/*",
    "*/scripts/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == '__main__':",
    "if __name__ == \"__main__\":",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # line-length
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"consumer_client/*" = ["E402"]
